version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "jest-expo"
          - "eslint-config-expo"
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # SDK upgrades need a manual migration (npx expo install --fix)
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      # Majors blocked by the Expo toolchain: jest-expo builds on Jest 29, and
      # eslint-config-expo's eslint-plugin-react only supports ESLint up to 9
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Pinned to the versions the current Expo SDK expects
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-web"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
